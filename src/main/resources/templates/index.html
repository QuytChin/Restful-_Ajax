<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalog | Quản lý sản phẩm</title><link rel="stylesheet" th:href="@{/css/app.css(v=6)}" href="/css/app.css"><script defer th:src="@{/js/app.js(v=6)}" src="/js/app.js"></script></head>
<body th:attr="data-mode=${mode},data-page=${page},data-base=@{/}">
<aside><a class="brand" th:href="@{/home}" href="/home"><span class="logo">N</span> NOVA<span class="brand-suffix">DESK</span></a>
<nav><a th:href="@{/home}" href="/home" data-nav="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7 M5 9v12h5v-7h4v7h5V9"/></svg> Trang chủ</a><a th:href="@{/admin/categories}" data-nav="categories"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg> Danh mục</a><a th:href="@{/admin/products}" data-nav="products"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5v8l-9 5-9-5V8Z M3 8l9 5 9-5 M12 13v8 M7 5.8l9 5"/></svg> Sản phẩm</a></nav>
</aside>
<div class="workspace"><header><div class="breadcrumb">NOVA <span>/</span> <b id="crumb">Tổng quan</b></div><div class="profile"><div class="avatar">TC</div><div><b>Trần Quyết Chiến</b><small>LTWeb09</small></div></div></header>
<main><div class="page-heading"><div><h1 id="pageTitle">Khám phá sản phẩm</h1><p id="subtitle" hidden></p></div><button class="primary" id="addBtn" hidden>+ Thêm mới</button></div>
<div id="notice" role="status" aria-live="polite" hidden></div>
<section class="stats"><div><span id="countLabel">Sản phẩm</span><strong id="resultCount">—</strong></div><div><span>Danh mục</span><strong id="categoryCount">—</strong></div></section>
<section class="content-panel"><div class="toolbar"><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="keyword" type="search" placeholder="Tìm theo tên sản phẩm…" aria-label="Tìm kiếm theo tên"></label><select id="categoryFilter" aria-label="Lọc danh mục"><option value="">Tất cả danh mục</option></select><select id="sort" aria-label="Sắp xếp"><option value="id">ID tăng dần</option><option value="priceAsc">Giá thấp đến cao</option><option value="priceDesc">Giá cao đến thấp</option></select><select id="pageSize" aria-label="Số dòng mỗi trang"><option value="5">5 dòng / trang</option><option value="10">10 dòng / trang</option><option value="20">20 dòng / trang</option></select><button id="refresh" class="secondary">Làm mới</button></div>
<div id="loading" role="status" hidden>Đang tải dữ liệu…</div><div id="empty" class="empty" hidden><h3>Chưa có kết quả</h3><p>Thử đổi từ khóa hoặc thêm dữ liệu mới.</p></div>
<div id="cards" class="cards" hidden></div><div id="tableWrap" class="table-wrap" hidden><table><thead id="tableHead"></thead><tbody id="rows"></tbody></table></div><footer id="pagination" hidden><span id="pageInfo"></span><div><button id="prev" class="secondary">← Trước</button><b id="pageNumber"></b><button id="next" class="secondary">Sau →</button></div></footer></section>
</main></div>
<dialog id="editor"><form id="editForm"><div class="modal-head"><div><h2 id="editorTitle">Thêm mới</h2></div><button type="button" id="closeEditor" class="icon-button" aria-label="Đóng">×</button></div><div id="formError" role="alert" hidden></div><div id="fields"></div><div class="modal-actions"><button type="button" id="cancelEditor" class="secondary">Hủy</button><button type="submit" id="saveBtn" class="primary">Lưu thông tin</button></div></form></dialog>
<dialog id="detail"><div class="modal-head"><h2>Chi tiết sản phẩm</h2><button id="closeDetail" class="icon-button" aria-label="Đóng">×</button></div><div id="detailContent"></div></dialog>
</body></html>
